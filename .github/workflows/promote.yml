name: Promote (reusable)

# ADR-039 promotion: dev -> stg, stg -> main. Fast-forward only, then tag the
# promoted commit and start that environment's deploy.
#
# dev -> stg first squashes everything on dev since stg into ONE release commit
# (ADR-041 rule 9) and force-pushes dev to it (with a lease, so a merge landing
# mid-promote aborts instead of being lost). The release commit names everyone
# else who authored a squashed commit as Co-authored-by, so their work stays
# attributed on stg and main. Open PRs into dev need a rebase afterwards.
#
# Called from each service repo by a small workflow_dispatch stub:
#
#   on:
#     workflow_dispatch:
#       inputs:
#         target: { type: choice, options: [stg, main], required: true }
#         bump:   { type: choice, options: [patch, minor, major], default: patch }
#   jobs:
#     promote:
#       uses: giracore/.github/.github/workflows/promote.yml@main
#       with: { target: ${{ inputs.target }}, bump: ${{ inputs.bump }}, deploy_workflow: deploy-env.yml }
#       permissions: { contents: write, actions: write }
#
# A tag pushed with GITHUB_TOKEN starts no workflow on its own, so this
# workflow starts the deploy explicitly (workflow_dispatch is the exception
# GitHub allows). The deploy then checks that the tag came from here.

on:
  workflow_call:
    inputs:
      target:
        description: "stg (from dev) or main (from stg)"
        type: string
        required: true
      bump:
        description: "patch, minor or major"
        type: string
        default: patch
      deploy_workflow:
        description: "Workflow file in the calling repo that deploys a tag (empty = tag only)"
        type: string
        default: ""

permissions:
  contents: write
  actions: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fast-forward, tag, deploy
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.target }}
          BUMP: ${{ inputs.bump }}
          DEPLOY_WORKFLOW: ${{ inputs.deploy_workflow }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            stg)  SOURCE=dev; PREFIX=stg_v ;;
            main) SOURCE=stg; PREFIX=prod_v ;;
            *) echo "target must be stg or main" >&2; exit 1 ;;
          esac
          case "$BUMP" in patch|minor|major) ;; *) echo "bump must be patch, minor or major" >&2; exit 1 ;; esac

          git fetch --tags --force origin
          src=$(git rev-parse "origin/$SOURCE")
          dst=$(git rev-parse "origin/$TARGET")
          if [ "$src" = "$dst" ]; then
            echo "$TARGET is already at $SOURCE ($src); nothing to promote." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! git merge-base --is-ancestor "$dst" "$src"; then
            {
              echo "❌ $TARGET has commits that are not on $SOURCE, so it cannot fast-forward."
              echo
              echo "Someone pushed to $TARGET directly. Bring those commits into $SOURCE first (merge $TARGET into $SOURCE via a PR), then promote again."
              echo
              git log --oneline "$src..$dst"
            } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # Next version from the highest existing tag with this prefix.
          last=$(git tag --list "${PREFIX}*" | sed "s/^${PREFIX}//" | { grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -1)
          last=${last:-0.0.0}
          IFS=. read -r major minor patch <<< "$last"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          tag="${PREFIX}${major}.${minor}.${patch}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          squashed=""
          if [ "$TARGET" = stg ] && [ "$(git rev-list --count "$dst..$src")" -gt 1 ]; then
            # Authors by GitHub login where GitHub knows them; the person
            # promoting is the release commit's author, bots are dropped.
            actor_json=$(gh api "users/$ACTOR")
            actor_name=$(jq -r '.name // .login' <<< "$actor_json")
            actor_email="$(jq -r .id <<< "$actor_json")+${ACTOR}@users.noreply.github.com"
            coauthors=$(
              gh api "repos/$GITHUB_REPOSITORY/compare/$dst...$src" --paginate \
                --jq '.commits[] | select((.author.login // "") != env.ACTOR) | select(((.author.login // "") | test("\\[bot\\]$")) | not) | "\(.commit.author.name) <\(.commit.author.email)>"'
              git log --format=%B "$dst..$src" | sed -n 's/^Co-authored-by: *//Ip'
            )
            coauthors=$(printf '%s\n' "$coauthors" | grep -v -i -e '\[bot\]' -e "<.*${ACTOR}@users.noreply.github.com>" | awk 'NF && !seen[tolower($0)]++' || true)
            msg=$(
              echo "Release ${tag#"$PREFIX"}"
              echo
              git log --reverse --format='- %s' "$dst..$src"
              if [ -n "$coauthors" ]; then
                echo
                printf '%s\n' "$coauthors" | sed 's/^/Co-authored-by: /'
              fi
            )
            release=$(GIT_AUTHOR_NAME="$actor_name" GIT_AUTHOR_EMAIL="$actor_email" \
              git commit-tree "$src^{tree}" -p "$dst" -m "$msg")
            # Lease on dev: a merge that lands while this runs makes the push fail.
            git push --force-with-lease="refs/heads/$SOURCE:$src" origin "$release:refs/heads/$SOURCE"
            squashed=" (squashed $(git rev-list --count "$dst..$src") commits from ${src:0:7})"
            src=$release
          fi

          git push origin "$src:refs/heads/$TARGET"
          git tag -a "$tag" "$src" -m "Promoted $SOURCE -> $TARGET by @$ACTOR at $(date -u +%FT%TZ) (ADR-039)"
          git push origin "refs/tags/$tag"

          {
            echo "✅ $TARGET fast-forwarded to \`${src:0:7}\`$squashed and tagged **$tag** (by @$ACTOR)."
            echo
            git log --format=%B -1 "$src"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$DEPLOY_WORKFLOW" ]; then
            gh workflow run "$DEPLOY_WORKFLOW" --ref "$tag" -f tag="$tag"
            echo "Deploy started: $DEPLOY_WORKFLOW for $tag" >> "$GITHUB_STEP_SUMMARY"
          fi
